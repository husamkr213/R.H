<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Husam & Reema</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: #080808; color: #777; text-align: center; overflow-x: hidden; }
    
    /* زر الصوت */
    #music-control {
      position: fixed; top: 20px; right: 20px; z-index: 1000;
      background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08); color: #777;
      width: 50px; height: 50px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.3rem; transition: 0.3s;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .content { position: relative; z-index: 1; padding: 70px 20px 40px; }
    .header h1 { font-size: 2.5rem; color: #555; text-shadow: none; margin-bottom: 10px; }
    .timer-box { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); padding: 25px; border-radius: 25px; display: inline-block; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 30px; }
    #timer { font-size: 1.2rem; line-height: 1.7; color: #888; }
    
    .gallery { display: flex; flex-direction: column; align-items: center; gap: 45px; }
    .photo-card { width: 100%; max-width: 450px; background: rgba(255, 255, 255, 0.02); border-radius: 30px; padding: 18px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 15px 35px rgba(0,0,0,0.9); }
    
    /* تأثير داكن وباهت للصور (أبيض وأسود مع إعتام) */
    .photo-card img { 
      width: 100%; 
      border-radius: 22px; 
      display: block; 
      margin-bottom: 15px; 
      filter: grayscale(100%) brightness(0.55) contrast(1.1);
      transition: filter 0.3s ease;
    }
    
    .love-text { font-size: 1.2rem; font-weight: bold; color: #666; text-shadow: none; }
    
    audio { display: none; }
  </style>
</head>
<body>

  <div id="music-control">
    <i id="music-icon" class="fas fa-volume-mute"></i>
  </div>

  <!-- الأغنية الجديدة -->
  <audio id="loveSong" loop>
    <source src="عفتني.mp3" type="audio/mpeg">
  </audio>

  <div class="content">
    <div class="header">
      <h1>Husam & Reema</h1>
      <div class="timer-box"><div id="timer">انتهى الوقت</div></div>
    </div>

    <div class="gallery">
      <div class="photo-card"><img src="IMG_6122.png"><p class="love-text">Ich liebe dich 🤍🫶🏻</p></div>
      <div class="photo-card"><img src="IMG_6123.png"><p class="love-text">حياتي انتي ❤️</p></div>
      <div class="photo-card"><img src="IMG_6128.png"><p class="love-text">אני אוהב אותך ❤️‍🔥</p></div>
      <div class="photo-card"><img src="IMG_6145.png"><p class="love-text">אני לא רוצה לעזוב אותך ❤️‍🩹🫶🏻</p></div>
      <div class="photo-card"><img src="IMG_6146.png"><p class="love-text">אתה החיים שלי ❤️‍🔥</p></div>
      
      <div class="photo-card"><img src="66666.png"><p class="love-text">Lonely Lonley 😍</p></div>
      <div class="photo-card"><img src="IMG_6120.png"><p class="love-text">i love you ro7e 👀❤️</p></div>
      <div class="photo-card"><img src="IMG_6121.png"><p class="love-text">حياتي حلوة معاكي ❤️</p></div>
      <div class="photo-card"><img src="IMG_6125.png"><p class="love-text">انا بموت عليك يروحي 🤍🫶🏻</p></div>
      <div class="photo-card"><img src="IMG_6147.png"><p class="love-text">لو تعرف قديش بحبك وبحب حياتي معك 😍❤️</p></div>
      <div class="photo-card"><img src="IMG_6149.png"><p class="love-text">بحب اشوف ضحكتك دايماً ❤️</p></div>
    </div>
  </div>

  <script>
    const song = document.getElementById('loveSong');
    const musicBtn = document.getElementById('music-control');
    const musicIcon = document.getElementById('music-icon');

    musicBtn.addEventListener('click', () => {
      if (song.paused) {
        song.play();
        musicIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
        musicBtn.style.background = "rgba(255, 255, 255, 0.12)";
      } else {
        song.pause();
        musicIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
        musicBtn.style.background = "rgba(255, 255, 255, 0.04)";
      }
    });

    // حساب الوقت وتثبيته متوقفاً عند لحظة الحفظ
    const startDate = new Date("2025-04-10T00:00:00").getTime();
    const endDate = new Date().getTime(); 
    const diff = endDate - startDate;
    
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    
    document.getElementById("timer").innerHTML = `توقف الوقت عند: <br> ${days} يوم و ${hours} ساعة و ${minutes} دقيقة و ${seconds} ثانية`;
  </script>
</body>
</html>
