<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Husam & Reema - Forgotten Memories</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: #020202;
      color: #666;
      text-align: center;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* خلفية الغبار والضباب المتحرك */
    #dustCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.45;
    }

    /* ظلال الحواف لإبراز العتمة والمظهر المهجور */
    .vignette-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.95) 90%);
    }

    /* شبكات العنكبوت في زوايا الشاشة الكبرى */
    .screen-web {
      position: fixed;
      pointer-events: none;
      z-index: 12;
      opacity: 0.65;
      filter: drop-shadow(0px 0px 2px rgba(255, 255, 255, 0.2));
    }
    .web-top-left { top: -10px; left: -10px; width: 250px; height: 250px; }
    .web-top-right { top: -10px; right: -10px; width: 250px; height: 250px; transform: scaleX(-1); }
    .web-bottom-left { bottom: -10px; left: -10px; width: 220px; height: 220px; transform: scaleY(-1); }
    .web-bottom-right { bottom: -10px; right: -10px; width: 220px; height: 220px; transform: scale(-1, -1); }

    /* زر مشغل الصوت */
    #music-control {
      position: fixed;
      top: 25px;
      right: 25px;
      z-index: 100;
      background: rgba(15, 15, 15, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #666;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.4s ease;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
    }
    #music-control:hover {
      color: #aaa;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* الحاوية الرئيسية */
    .content {
      position: relative;
      z-index: 10;
      padding: 80px 20px 60px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* عنوان الصفحة والمؤقت */
    .header h1 {
      font-size: 2.2rem;
      font-weight: 300;
      color: #4a4a4a;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .timer-box {
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(12px);
      padding: 22px 30px;
      border-radius: 20px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.04);
      margin-bottom: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    .timer-box::before {
      content: '';
      position: absolute;
      top: -5px;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    #timer {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #777;
    }

    /* معرض الصور */
    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 55px;
    }

    /* كروت الصور والتصميم الداكن المهجور */
    .photo-card {
      position: relative;
      width: 100%;
      background: #090909;
      border-radius: 24px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 0 30px 60px rgba(0,0,0,0.95);
      transition: transform 0.5s ease;
    }

    /* خيوط العنكبوت الملتصقة بأركان كل صورة */
    .card-web-corner-top {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 110px;
      height: 110px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.75;
    }

    .card-web-corner-bottom {
      position: absolute;
      bottom: -2px;
      left: -2px;
      width: 90px;
      height: 90px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.65;
      transform: scale(-1, -1);
    }

    /* إطارات وتأثير التعتيم على الصور */
    .photo-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
    }

    .photo-card img {
      width: 100%;
      display: block;
      filter: grayscale(100%) brightness(0.42) contrast(1.25);
      transition: filter 0.6s ease, transform 0.6s ease;
    }

    .photo-card:hover img {
      filter: grayscale(80%) brightness(0.55) contrast(1.15);
      transform: scale(1.02);
    }

    /* تأثير الطبقة المغبرة فوق الصورة */
    .photo-wrapper::after {
      content: '';
      position: absolute;
      top:0; left:0; width:100%; height:100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    .love-text {
      margin-top: 16px;
      font-size: 1.05rem;
      font-weight: 400;
      color: #555;
      letter-spacing: 0.5px;
    }

    /* كائن العنكبوت */
    .spider-entity {
      position: fixed;
      width: 24px;
      height: 24px;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      transition: top 6s ease-in-out, left 6s ease-in-out, opacity 1s ease;
    }

    .spider-body {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .spider-head {
      position: absolute;
      top: 8px;
      left: 9px;
      width: 6px;
      height: 6px;
      background: #222;
      border-radius: 50%;
      box-shadow: 0 0 2px #000;
    }

    .spider-abdomen {
      position: absolute;
      top: 12px;
      left: 7px;
      width: 10px;
      height: 11px;
      background: #181818;
      border-radius: 50%;
      border: 1px solid #111;
    }

    /* أرجل العنكبوت الثمانية */
    .leg {
      position: absolute;
      width: 10px;
      height: 1px;
      background: #252525;
    }
    .leg-left-1 { top: 9px; left: 0px; transform: rotate(-25deg); }
    .leg-left-2 { top: 11px; left: -1px; transform: rotate(-5deg); }
    .leg-left-3 { top: 13px; left: -1px; transform: rotate(15deg); }
    .leg-left-4 { top: 15px; left: 1px; transform: rotate(35deg); }

    .leg-right-1 { top: 9px; right: 0px; transform: rotate(25deg); }
    .leg-right-2 { top: 11px; right: -1px; transform: rotate(5deg); }
    .leg-right-3 { top: 13px; right: -1px; transform: rotate(-15deg); }
    .leg-right-4 { top: 15px; right: 1px; transform: rotate(-35deg); }

    .spider-entity.active {
      opacity: 0.85;
    }

    audio { display: none; }
  </style>
</head>

  <script>
    /* 1. إدارة تشغيل الصوت */
    const song = document.getElementById('loveSong');
    const musicBtn = document.getElementById('music-control');
    const musicIcon = document.getElementById('music-icon');

    musicBtn.addEventListener('click', () => {
      if (song.paused) {
        song.play().then(() => {
          musicIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
          musicBtn.style.borderColor = "rgba(255, 255, 255, 0.25)";
        }).catch(err => console.log(err));
      } else {
        song.pause();
        musicIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
        musicBtn.style.borderColor = "rgba(255, 255, 255, 0.08)";
      }
    });

    /* 2. حساب وتثبيت الوقت */
    const startDate = new Date("2025-04-10T00:00:00").getTime();
    const endDate = new Date("2026-08-09T17:36:00").getTime(); 
    const diff = endDate - startDate;
    
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    
    document.getElementById("timer").innerHTML = `توقف الوقت عند:<br><strong>${days}</strong> يوم و <strong>${hours}</strong> ساعة و <strong>${minutes}</strong> دقيقة و <strong>${seconds}</strong> ثانية`;

    /* 3. محرك جزيئات الغبار */
    const canvas = document.getElementById('dustCanvas');
    const ctx = canvas.getContext('2d');
    
    let particles = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.2 + 0.3,
        alpha: Math.random() * 0.5 + 0.1,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.2
      });
    }

    function animateDust() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 200, 200, ${p.alpha})`;
        ctx.fill();
      });
      requestAnimationFrame(animateDust);
    }
    animateDust();

    /* 4. برمجة العناكب الحية */
    function triggerSpiders() {
      const spider1 = document.getElementById('spider1');
      const spider2 = document.getElementById('spider2');

      const targetY1 = Math.random() * (window.innerHeight - 100) + 50;
      const targetX1 = Math.random() * (window.innerWidth - 100) + 50;

      const targetY2 = Math.random() * (window.innerHeight - 100) + 50;
      const targetX2 = Math.random() * (window.innerWidth - 100) + 50;

      spider1.style.top = targetY1 + 'px';
      spider1.style.left = targetX1 + 'px';
      spider1.classList.add('active');

      spider2.style.top = targetY2 + 'px';
      spider2.style.left = targetX2 + 'px';
      spider2.classList.add('active');

      setTimeout(() => {
        spider1.classList.remove('active');
        spider2.classList.remove('active');
      }, 5500);
    }

    triggerSpiders();
    setInterval(triggerSpiders, 10000);
  </script>
