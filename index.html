<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Husam & Reema</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Cairo', sans-serif; 
      background: #050505; 
      color: #666; 
      text-align: center; 
      overflow-x: hidden; 
      position: relative;
    }
    
    /* شبكات العنكبوت في زوايا الشاشة */
    .web-corner {
      position: fixed;
      width: 140px;
      height: 140px;
      pointer-events: none;
      z-index: 999;
      opacity: 0.35;
      background-size: contain;
      background-repeat: no-repeat;
      filter: drop-shadow(0 0 2px rgba(255,255,255,0.2));
    }
    .web-top-left {
      top: 0; left: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"><path d="M0,0 L100,0 M0,0 L0,100 M0,0 L100,100 M0,0 L60,100 M0,0 L100,60"/><path d="M20,0 Q20,20 0,20 M40,0 Q40,40 0,40 M60,0 Q60,60 0,60 M80,0 Q80,80 0,80"/></svg>');
    }
    .web-top-right {
      top: 0; right: 0;
      transform: scaleX(-1);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"><path d="M0,0 L100,0 M0,0 L0,100 M0,0 L100,100 M0,0 L60,100 M0,0 L100,60"/><path d="M20,0 Q20,20 0,20 M40,0 Q40,40 0,40 M60,0 Q60,60 0,60 M80,0 Q80,80 0,80"/></svg>');
    }
    .web-bottom-left {
      bottom: 0; left: 0;
      transform: scaleY(-1);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"><path d="M0,0 L100,0 M0,0 L0,100 M0,0 L100,100 M0,0 L60,100 M0,0 L100,60"/><path d="M20,0 Q20,20 0,20 M40,0 Q40,40 0,40 M60,0 Q60,60 0,60 M80,0 Q80,80 0,80"/></svg>');
    }
    .web-bottom-right {
      bottom: 0; right: 0;
      transform: scale(-1, -1);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"><path d="M0,0 L100,0 M0,0 L0,100 M0,0 L100,100 M0,0 L60,100 M0,0 L100,60"/><path d="M20,0 Q20,20 0,20 M40,0 Q40,40 0,40 M60,0 Q60,60 0,60 M80,0 Q80,80 0,80"/></svg>');
    }

    /* زر الصوت */
    #music-control {
      position: fixed; top: 20px; right: 20px; z-index: 1000;
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06); color: #555;
      width: 50px; height: 50px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.3rem; transition: 0.3s;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
    }

    .content { position: relative; z-index: 1; padding: 70px 20px 40px; }
    .header h1 { font-size: 2.3rem; color: #444; text-shadow: none; margin-bottom: 10px; letter-spacing: 1px; }
    .timer-box { background: rgba(255, 255, 255, 0.01); backdrop-filter: blur(15px); padding: 25px; border-radius: 25px; display: inline-block; border: 1px solid rgba(255, 255, 255, 0.04); margin-bottom: 30px; }
    #timer { font-size: 1.1rem; line-height: 1.7; color: #777; }
    
    .gallery { display: flex; flex-direction: column; align-items: center; gap: 45px; }
    
    /* بطاقة الصور مع إضافة خيوط عنكبوت في زاوية كل صورة */
    .photo-card { 
      position: relative;
      width: 100%; 
      max-width: 450px; 
      background: rgba(255, 255, 255, 0.015); 
      border-radius: 30px; 
      padding: 18px; 
      border: 1px solid rgba(255, 255, 255, 0.04); 
      box-shadow: 0 20px 40px rgba(0,0,0,0.95);
      overflow: hidden;
    }

    /* خيط عنكبوت ملتصق بكل صورة */
    .photo-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 80px; height: 80px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.4;
      background-size: contain;
      background-repeat: no-repeat;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"><path d="M100,0 L0,0 M100,0 L100,100 M100,0 L0,100 M100,0 L30,100 M100,0 L0,30"/><path d="M80,0 Q80,20 100,20 M60,0 Q60,40 100,40 M40,0 Q40,60 100,60"/></svg>');
    }
    
    /* تأثير الصور الباهتة والحزينة */
    .photo-card img { 
      width: 100%; 
      border-radius: 22px; 
      display: block; 
      margin-bottom: 15px; 
      filter: grayscale(100%) brightness(0.5) contrast(1.15);
      transition: filter 0.3s ease;
    }
    
    .love-text { font-size: 1.1rem; font-weight: bold; color: #555; text-shadow: none; }
    
    audio { display: none; }
  </style>
</head>
<body>

  <!-- خيوط العنكبوت للأركان الاربعة -->
  <div class="web-corner web-top-left"></div>
  <div class="web-corner web-top-right"></div>
  <div class="web-corner web-bottom-left"></div>
  <div class="web-corner web-bottom-right"></div>

  <div id="music-control">
    <i id="music-icon" class="fas fa-volume-mute"></i>
  </div>

  <audio id="loveSong" loop playsinline preload="auto">
    <source src="Songggg.mp3" type="audio/mpeg">
  </audio>

  <div class="content">
    <div class="header">
      <h1>Husam & Reema</h1>
      <div class="timer-box"><div id="timer">انتهى الوقت</div></div>
    </div>

    <div class="gallery">
      <div class="photo-card"><img src="IMG_6122.png"><p class="love-text">Ich liebe dich 🤍🫶🏻</p></div>
      <div class="photo-card"><img src="IMG_6123.png"><p class="love-text">حياتي انتي ❤️</p></div>
      <div class="photo-card"><img src="IMG_6128.png"><p class="love-text">אני אוהב אותך ❤️‍🔥</p></div>
      <div class="photo-card"><img src="IMG_6145.png"><p class="love-text">אני לא רוצה לעזוב אותך ❤️‍🩹🫶🏻</p></div>
      <div class="photo-card"><img src="IMG_6146.png"><p class="love-text">אתה החיים שלי ❤️‍🔥</p></div>
      
      <div class="photo-card"><img src="66666.png"><p class="love-text">Lonely Lonley 😍</p></div>
      <div class="photo-card"><img src="IMG_6120.png"><p class="love-text">i love you ro7e 👀❤️</p></div>
      <div class="photo-card"><img src="IMG_6121.png"><p class="love-text">حياتي حلوة معاكي ❤️</p></div>
      <div class="photo-card"><img src="IMG_6125.png"><p class="love-text">انا بموت عليك يروحي 🤍🫶🏻</p></div>
      <div class="photo-card"><img src="IMG_6147.png"><p class="love-text">لو تعرف قديش بحبك وبحب حياتي معك 😍❤️</p></div>
      <div class="photo-card"><img src="IMG_6149.png"><p class="love-text">بحب اشوف ضحكتك دايماً ❤️</p></div>
    </div>
  </div>

  <script>
    const song = document.getElementById('loveSong');
    const musicBtn = document.getElementById('music-control');
    const musicIcon = document.getElementById('music-icon');

    musicBtn.addEventListener('click', () => {
      if (song.paused) {
        song.play().then(() => {
          musicIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
          musicBtn.style.background = "rgba(255, 255, 255, 0.1)";
        }).catch(err => console.log(err));
      } else {
        song.pause();
        musicIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
        musicBtn.style.background = "rgba(255, 255, 255, 0.03)";
      }
    });

    const startDate = new Date("2025-04-10T00:00:00").getTime();
    const endDate = new Date("2026-08-09T17:36:00").getTime(); 
    const diff = endDate - startDate;
    
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    
    document.getElementById("timer").innerHTML = `توقف الوقت عند: <br> ${days} يوم و ${hours} ساعة و ${minutes} دقيقة و ${seconds} ثانية`;
  </script>
</body>
</html>
