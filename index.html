<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Husam & Reema</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Cairo', sans-serif; 
      background: #030303; 
      color: #555; 
      text-align: center; 
      overflow-x: hidden; 
      position: relative;
    }
    
    /* شبكات العنكبوت الكثيفة في زوايا وجوانب الشاشة */
    .bg-web {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      opacity: 0.6;
      background-size: contain;
      background-repeat: no-repeat;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.15));
    }
    .web-top-left {
      top: 0; left: 0; width: 220px; height: 220px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="0.8"><path d="M0,0 L200,0 M0,0 L0,200 M0,0 L200,200 M0,0 L120,200 M0,0 L200,120 M0,0 L70,200 M0,0 L200,70"/><path d="M30,0 Q30,30 0,30 M60,0 Q60,60 0,60 M90,0 Q90,90 0,90 M120,0 Q120,120 0,120 M150,0 Q150,150 0,150 M180,0 Q180,180 0,180"/><path d="M15,0 Q15,15 0,15 M45,0 Q45,45 0,45 M75,0 Q75,75 0,75 M105,0 Q105,105 0,105 M135,0 Q135,135 0,135 M165,0 Q165,165 0,165" stroke-dasharray="2 1"/></svg>');
    }
    .web-top-right {
      top: 0; right: 0; width: 220px; height: 220px; transform: scaleX(-1);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="0.8"><path d="M0,0 L200,0 M0,0 L0,200 M0,0 L200,200 M0,0 L120,200 M0,0 L200,120 M0,0 L70,200 M0,0 L200,70"/><path d="M30,0 Q30,30 0,30 M60,0 Q60,60 0,60 M90,0 Q90,90 0,90 M120,0 Q120,120 0,120 M150,0 Q150,150 0,150 M180,0 Q180,180 0,180"/><path d="M15,0 Q15,15 0,15 M45,0 Q45,45 0,45 M75,0 Q75,75 0,75 M105,0 Q105,105 0,105 M135,0 Q135,135 0,135 M165,0 Q165,165 0,165" stroke-dasharray="2 1"/></svg>');
    }
    .web-bottom-left {
      bottom: 0; left: 0; width: 200px; height: 200px; transform: scaleY(-1);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="0.8"><path d="M0,0 L200,0 M0,0 L0,200 M0,0 L200,200 M0,0 L120,200 M0,0 L200,120 M0,0 L70,200 M0,0 L200,70"/><path d="M30,0 Q30,30 0,30 M60,0 Q60,60 0,60 M90,0 Q90,90 0,90 M120,0 Q120,120 0,120 M150,0 Q150,150 0,150 M180,0 Q180,180 0,180"/></svg>');
    }
    .web-bottom-right {
      bottom: 0; right: 0; width: 200px; height: 200px; transform: scale(-1, -1);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="0.8"><path d="M0,0 L200,0 M0,0 L0,200 M0,0 L200,200 M0,0 L120,200 M0,0 L200,120 M0,0 L70,200 M0,0 L200,70"/><path d="M30,0 Q30,30 0,30 M60,0 Q60,60 0,60 M90,0 Q90,90 0,90 M120,0 Q120,120 0,120 M150,0 Q150,150 0,150 M180,0 Q180,180 0,180"/></svg>');
    }

    /* العناكب التي تتحرك كل 10 ثوانٍ */
    .spider {
      position: fixed;
      width: 20px;
      height: 20px;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: all 4s ease-in-out;
    }
    .spider::before {
      content: '🕷️';
      font-size: 16px;
      filter: grayscale(100%) brightness(0.7);
    }
    
    /* حركة العنكبوت عند التنشيط */
    .spider.crawling {
      opacity: 0.8;
    }

    /* زر الصوت */
    #music-control {
      position: fixed; top: 20px; right: 20px; z-index: 1000;
      background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05); color: #444;
      width: 50px; height: 50px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.3rem; transition: 0.3s;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.95);
    }

    .content { position: relative; z-index: 1; padding: 70px 20px 40px; }
    .header h1 { font-size: 2.2rem; color: #353535; text-shadow: none; margin-bottom: 10px; letter-spacing: 1px; }
    .timer-box { background: rgba(255, 255, 255, 0.01); backdrop-filter: blur(15px); padding: 25px; border-radius: 25px; display: inline-block; border: 1px solid rgba(255, 255, 255, 0.03); margin-bottom: 30px; }
    #timer { font-size: 1.1rem; line-height: 1.7; color: #666; }
    
    .gallery { display: flex; flex-direction: column; align-items: center; gap: 45px; }
    
    /* بطاقة الصور المغطاة بخيوط عنكبوت عشوائية من الأعلى والأطراف */
    .photo-card { 
      position: relative;
      width: 100%; 
      max-width: 450px; 
      background: rgba(15, 15, 15, 0.4); 
      border-radius: 30px; 
      padding: 18px; 
      border: 1px solid rgba(255, 255, 255, 0.03); 
      box-shadow: 0 25px 50px rgba(0,0,0,0.98);
      overflow: hidden;
    }

    /* شبكة عنكبوت كثيفة على الزاوية العلوية اليمنى للصور */
    .photo-card::before {
      content: '';
      position: absolute;
      top: -10px; right: -10px;
      width: 120px; height: 120px;
      pointer-events: none;
      z-index: 3;
      opacity: 0.65;
      background-size: contain;
      background-repeat: no-repeat;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.7"><path d="M100,0 L0,0 M100,0 L100,100 M100,0 L0,100 M100,0 L40,100 M100,0 L0,40"/><path d="M85,0 Q85,15 100,15 M70,0 Q70,30 100,30 M55,0 Q55,45 100,45 M40,0 Q40,60 100,60 M25,0 Q25,75 100,75"/></svg>');
    }

    /* خيوط عنكبوت متدلية من زاوية الصورة السفلى */
    .photo-card::after {
      content: '';
      position: absolute;
      bottom: -10px; left: -10px;
      width: 100px; height: 100px;
      pointer-events: none;
      z-index: 3;
      opacity: 0.55;
      transform: rotate(180deg);
      background-size: contain;
      background-repeat: no-repeat;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.7"><path d="M100,0 L0,0 M100,0 L100,100 M100,0 L0,100 M100,0 L40,100 M100,0 L0,40"/><path d="M85,0 Q85,15 100,15 M70,0 Q70,30 100,30 M55,0 Q55,45 100,45 M40,0 Q40,60 100,60"/></svg>');
    }
    
    /* مظهر داكن جداً وباهت للصور */
    .photo-card img { 
      width: 100%; 
      border-radius: 22px; 
      display: block; 
      margin-bottom: 15px; 
      filter: grayscale(100%) brightness(0.48) contrast(1.2);
      transition: filter 0.3s ease;
    }
    
    .love-text { font-size: 1.1rem; font-weight: bold; color: #444; text-shadow: none; }
    
    audio { display: none; }
  </style>
</head>
<body>

  <!-- خيوط العناكب الضخمة للزوايا -->
  <div class="bg-web web-top-left"></div>
  <div class="bg-web web-top-right"></div>
  <div class="bg-web web-bottom-left"></div>
  <div class="bg-web web-bottom-right"></div>

  <!-- عناكب صغيرة تتحرك خلف الصور وعبر الشاشة -->
  <div class="spider" id="spider1"></div>
  <div class="spider" id="spider2"></div>

  <div id="music-control">
    <i id="music-icon" class="fas fa-volume-mute"></i>
  </div>

  <audio id="loveSong" loop playsinline preload="auto">
    <source src="Songggg.mp3" type="audio/mpeg">
  </audio>

  <div class="content">
    <div class="header">
      <h1>Husam & Reema</h1>
      <div class="timer-box"><div id="timer">انتهى الوقت</div></div>
    </div>

    <div class="gallery">
      <div class="photo-card"><img src="IMG_6122.png"><p class="love-text">Ich liebe dich 🤍🫶🏻</p></div>
      <div class="photo-card"><img src="IMG_6123.png"><p class="love-text">حياتي انتي ❤️</p></div>
      <div class="photo-card"><img src="IMG_6128.png"><p class="love-text">אני אוהב אותך ❤️‍🔥</p></div>
      <div class="photo-card"><img src="IMG_6145.png"><p class="love-text">אני לא רוצה לעזוב אותך ❤️‍🩹🫶🏻</p></div>
      <div class="photo-card"><img src="IMG_6146.png"><p class="love-text">אתה החיים שלי ❤️‍🔥</p></div>
      
      <div class="photo-card"><img src="66666.png"><p class="love-text">Lonely Lonley 😍</p></div>
      <div class="photo-card"><img src="IMG_6120.png"><p class="love-text">i love you ro7e 👀❤️</p></div>
      <div class="photo-card"><img src="IMG_6121.png"><p class="love-text">حياتي حلوة معاكي ❤️</p></div>
      <div class="photo-card"><img src="IMG_6125.png"><p class="love-text">انا بموت عليك يروحي 🤍🫶🏻</p></div>
      <div class="photo-card"><img src="IMG_6147.png"><p class="love-text">لو تعرف قديش بحبك وبحب حياتي معك 😍❤️</p></div>
      <div class="photo-card"><img src="IMG_6149.png"><p class="love-text">بحب اشوف ضحكتك دايماً ❤️</p></div>
    </div>
  </div>

  <script>
    const song = document.getElementById('loveSong');
    const musicBtn = document.getElementById('music-control');
    const musicIcon = document.getElementById('music-icon');

    musicBtn.addEventListener('click', () => {
      if (song.paused) {
        song.play().then(() => {
          musicIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
          musicBtn.style.background = "rgba(255, 255, 255, 0.08)";
        }).catch(err => console.log(err));
      } else {
        song.pause();
        musicIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
        musicBtn.style.background = "rgba(255, 255, 255, 0.02)";
      }
    });

    // العداد المتوقف
    const startDate = new Date("2025-04-10T00:00:00").getTime();
    const endDate = new Date("2026-08-09T17:36:00").getTime(); 
    const diff = endDate - startDate;
    
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    
    document.getElementById("timer").innerHTML = `توقف الوقت عند: <br> ${days} يوم و ${hours} ساعة و ${minutes} دقيقة و ${seconds} ثانية`;

    // برمجة حركة العناكب الصغار كل 10 ثوانٍ
    function moveSpiders() {
      const spider1 = document.getElementById('spider1');
      const spider2 = document.getElementById('spider2');

      // تحديد أماكن عشوائية للعنكبوت الأول
      const top1 = Math.random() * (window.innerHeight - 50);
      const left1 = Math.random() * (window.innerWidth - 50);
      spider1.style.top = top1 + 'px';
      spider1.style.left = left1 + 'px';
      spider1.classList.add('crawling');

      // تحديد أماكن عشوائية للعنكبوت الثاني
      const top2 = Math.random() * (window.innerHeight - 50);
      const left2 = Math.random() * (window.innerWidth - 50);
      spider2.style.top = top2 + 'px';
      spider2.style.left = left2 + 'px';
      spider2.classList.add('crawling');

      // إخفاء العناكب بعد حركتها بقليل لتبدو كأنها اختبأت خلف الصور
      setTimeout(() => {
        spider1.classList.remove('crawling');
        spider2.classList.remove('crawling');
      }, 4500);
    }

    // تشغيل الحركة فوراً ثم تكرارها كل 10 ثوانٍ
    moveSpiders();
    setInterval(moveSpiders, 10000);
  </script>
</body>
</html>
